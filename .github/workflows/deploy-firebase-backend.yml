name: Deploy Firebase backend

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Pilih yes hanya setelah akun Admin dan user profiles diperiksa."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UMROH_APP_DATABASE }}

      - name: Prepare OCR runtime configuration
        shell: bash
        env:
          DOCUMENT_AI_PROJECT_ID: ${{ vars.DOCUMENT_AI_PROJECT_ID }}
          DOCUMENT_AI_PROCESSOR_ID: ${{ vars.DOCUMENT_AI_PROCESSOR_ID }}
          DOCUMENT_AI_LOCATION: ${{ vars.DOCUMENT_AI_LOCATION }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          cat > functions/.env.umroh-app-database <<EOF
          DOCUMENT_AI_PROJECT_ID=${DOCUMENT_AI_PROJECT_ID:-umroh-app-database}
          DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID:-}
          DOCUMENT_AI_LOCATION=${DOCUMENT_AI_LOCATION:-asia-southeast1}
          VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-umroh-app-database}
          VERTEX_LOCATION=${VERTEX_LOCATION:-asia-southeast1}
          GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
          EOF
          chmod 600 functions/.env.umroh-app-database
          if [[ -z "${DOCUMENT_AI_PROCESSOR_ID:-}" ]]; then
            echo "::warning::DOCUMENT_AI_PROCESSOR_ID is not configured. OCR will return a setup error until the GitHub Actions variable is added."
          fi

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions

      - name: Deploy Firestore Rules and Cloud Functions
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,functions --project umroh-app-database --non-interactive
